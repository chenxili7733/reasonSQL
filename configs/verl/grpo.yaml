# Pure GRPO veRL/Hydra overrides. Paths are relative to the repository root.
# The launcher passes these keys directly to ``verl.trainer.main_ppo``.
data:
  train_files: data/processed/bird_rl_openai_2000.parquet
  val_files: data/processed/bird_rl_openai_2000.parquet
  train_batch_size: 16
  max_prompt_length: 10240
  max_response_length: 1024
  filter_overlong_prompts: true
  truncation: left
  shuffle: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: checkpoints/student_sft_qwen2.5_coder_7b
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    strategy: fsdp2
    optim:
      lr: 5e-7
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 1
    use_kl_loss: true
    kl_loss_coef: 0.001
    entropy_coeff: 0.0
    clip_ratio: 0.2
    fsdp_config:
      param_offload: False           
      grad_offload: False
      model_dtype: bfloat16
  rollout:
    n: 8
    max_model_len: 11264
    name: vllm
    mode: async
    temperature: 1.0
    top_p: 0.95
    top_k: -1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    max_num_batched_tokens: 32768
    free_cache_engine: true

trainer:
  nnodes: 1
  n_gpus_per_node: 4
  total_epochs: 1
  default_local_dir: checkpoints/grpo
  project_name: reasonsql
  experiment_name: grpo
  logger: [console, wandb]
  save_freq: 50
  test_freq: -1
  val_before_train: false
  resume_mode: auto
  device: cuda

custom_reward_function:
  path: reasonsql/verl_reward.py
  name: compute_score
