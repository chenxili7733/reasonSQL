### ReasonSQL student SFT (4 x A100-80GB)
model_name_or_path: Qwen/Qwen2.5-Coder-7B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/ds_zero3.json

dataset_dir: configs
dataset: bird_sft
template: qwen
cutoff_len: 4096
packing: false
overwrite_cache: true
preprocessing_num_workers: 16

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0

bf16: true
tf32: true
gradient_checkpointing: true
# Use FlashAttention 2 when it is installed, otherwise fall back to an
# attention backend available in the current PyTorch/Transformers image.
flash_attn: auto
ddp_timeout: 180000000

logging_steps: 5
save_strategy: steps
save_steps: 100
save_total_limit: 3
output_dir: checkpoints/student_sft_qwen2.5_coder_7b
overwrite_output_dir: false
plot_loss: true
report_to: wandb
run_name: reasonsql-student-sft
