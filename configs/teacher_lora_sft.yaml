### Optional domain adaptation for the 32B teacher.
### This is LoRA, not a 32B full-parameter fine-tune.
model_name_or_path: Qwen/Qwen2.5-Coder-32B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
deepspeed: configs/ds_zero3.json

dataset_dir: configs
dataset: bird_sft
template: qwen
cutoff_len: 4096
packing: false
overwrite_cache: false
preprocessing_num_workers: 16

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01

bf16: true
tf32: true
gradient_checkpointing: true
# Keep FlashAttention optional so a fresh cloud image does not fail before
# training merely because a matching flash-attn wheel is unavailable.
flash_attn: auto
ddp_timeout: 180000000

logging_steps: 5
save_steps: 100
save_total_limit: 2
output_dir: checkpoints/teacher_lora_qwen2.5_coder_32b
overwrite_output_dir: false
report_to: wandb
run_name: reasonsql-teacher-lora-sft
